<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BikinMars — Vélos en temps réel à Marseille</title>
  <meta name="description" content="Carte en temps réel des stations Levélo à Marseille. Trouvez un vélo disponible près de vous, consultez les disponibilités et naviguez vers la station la plus proche.">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Locate -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.locatecontrol@0.81.1/dist/L.Control.Locate.min.css" />
  <script src="https://unpkg.com/leaflet.locatecontrol@0.81.1/dist/L.Control.Locate.min.js"></script>

<style>
/* ==================== VARIABLES ==================== */
:root {
  /* ==================== VARIABLE SYSTEM (LIGHT THEME DEFAULT) ==================== */
  --bg-primary: #F8FAFC;
  --bg-secondary: #EDF2F7;
  --bg-glass: rgba(255, 255, 255, 0.85);
  --bg-glass-hover: rgba(247, 250, 252, 0.95);
  --text-primary: #1A202C;
  --text-secondary: #4A5568;
  --text-muted: #718096;
  --accent: #FF6B35;
  --accent-hover: #E0531F;
  --accent-glow: rgba(255, 107, 53, 0.15);
  --success: #0F766E;
  --success-bg: rgba(15, 118, 110, 0.12);
  --warning: #B45309;
  --warning-bg: rgba(180, 83, 9, 0.12);
  --danger: #BE123C;
  --danger-bg: rgba(190, 18, 60, 0.12);
  --muted: #718096;
  --muted-bg: rgba(113, 128, 150, 0.12);
  --border: rgba(26, 32, 44, 0.08);
  --border-hover: rgba(26, 32, 44, 0.15);
  --shadow: 0 8px 32px rgba(26, 32, 44, 0.08);
  --radius: 14px;
  --radius-sm: 10px;
  --sidebar-width: 380px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  /* ==================== DARK THEME SYSTEM OVERRIDES ==================== */
  --bg-primary: #0F172A;
  --bg-secondary: #1E293B;
  --bg-glass: rgba(15, 23, 42, 0.85);
  --bg-glass-hover: rgba(30, 41, 59, 0.9);
  --text-primary: #F1F5F9;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;
  --accent: #FF6B35;
  --accent-hover: #FF8555;
  --accent-glow: rgba(255, 107, 53, 0.25);
  --success: #2DD4BF;
  --success-bg: rgba(45, 212, 191, 0.15);
  --warning: #FBBF24;
  --warning-bg: rgba(251, 191, 36, 0.15);
  --danger: #EF4444;
  --danger-bg: rgba(239, 68, 68, 0.15);
  --muted: #6B7280;
  --muted-bg: rgba(107, 114, 128, 0.2);
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.15);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

/* ==================== RESET ==================== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); }
button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
input { font-family: inherit; }
a { color: inherit; text-decoration: none; }

/* ==================== MAP ==================== */
#map {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: var(--sidebar-width);
  z-index: 1;
  transition: left var(--transition);
}

/* ==================== LOADING ==================== */
#loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg-primary);
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
#loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loading-icon { font-size: 56px; animation: pulse-bounce 1.5s infinite ease-in-out; }
.loading-text { margin-top: 20px; font-size: 16px; font-weight: 500; color: var(--text-secondary); letter-spacing: 0.5px; }
.loading-bar { width: 200px; height: 3px; background: var(--bg-secondary); border-radius: 3px; margin-top: 16px; overflow: hidden; }
.loading-bar-fill { height: 100%; width: 40%; background: linear-gradient(90deg, var(--accent), var(--accent-hover)); border-radius: 3px; animation: loading-slide 1.2s infinite ease-in-out; }

/* ==================== SIDEBAR ==================== */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: var(--sidebar-width);
  background: var(--bg-glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-right: 1px solid var(--border);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  transition: transform var(--transition);
  overflow: hidden;
}

.sidebar-header {
  padding: 20px 20px 0;
  flex-shrink: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-icon {
  font-size: 36px;
  animation: gentle-bounce 3s infinite ease-in-out;
}
.brand-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent), #FF9F6B);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.brand-subtitle {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  margin-top: 2px;
  letter-spacing: 0.3px;
}
.sidebar-close {
  display: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  font-size: 18px;
  color: var(--text-secondary);
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  flex-shrink: 0;
}
.sidebar-close:hover { background: var(--bg-glass-hover); color: var(--text-primary); }

/* ==================== STATS ==================== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 18px 20px;
  flex-shrink: 0;
}
.stat-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 8px;
  text-align: center;
  transition: border-color var(--transition);
}
.stat-card:hover { border-color: var(--border-hover); }
.stat-value {
  display: block;
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.2;
}
.stat-value.accent { color: var(--accent); }
.stat-label {
  display: block;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

/* ==================== SEARCH ==================== */
.search-wrapper {
  padding: 0 20px;
  flex-shrink: 0;
}
.search-input {
  width: 100%;
  padding: 12px 16px 12px 42px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  transition: all var(--transition);
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.search-icon {
  position: absolute;
  left: 34px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  pointer-events: none;
  opacity: 0.5;
}

/* ==================== FILTERS ==================== */
.filter-bar {
  display: flex;
  gap: 8px;
  padding: 14px 20px;
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-pill {
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  transition: all var(--transition);
}
.filter-pill:hover { border-color: var(--border-hover); color: var(--text-primary); }
.filter-pill.active {
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent);
}

/* ==================== STATION LIST ==================== */
.station-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 12px 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--text-muted) transparent;
}
.station-list::-webkit-scrollbar { width: 4px; }
.station-list::-webkit-scrollbar-track { background: transparent; }
.station-list::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }

.station-card {
  padding: 14px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
  border: 1px solid transparent;
  margin-bottom: 4px;
}
.station-card:hover { background: var(--bg-secondary); border-color: var(--border); }
.station-card.highlighted { background: var(--accent-glow); border-color: var(--accent); }

.station-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.station-card-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.3;
}
.station-card-distance {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.station-card-bar {
  height: 4px;
  background: var(--bg-primary);
  border-radius: 4px;
  margin: 8px 0;
  overflow: hidden;
}
.station-card-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s ease;
}
.station-card-meta {
  display: flex;
  gap: 14px;
  font-size: 12px;
  color: var(--text-secondary);
}
.station-card-meta span { display: flex; align-items: center; gap: 4px; }
.station-card-badges {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}
.badge {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 6px;
  font-weight: 600;
}
.badge-electric { background: var(--warning-bg); color: var(--warning); }
.badge-charging { background: var(--success-bg); color: var(--success); }

.station-list-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

/* ==================== SIDEBAR FOOTER ==================== */
.sidebar-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
}
.sidebar-footer-text {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.countdown-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-hover));
  border-radius: 2px;
  transition: width 1s linear;
}

/* ==================== MOBILE TOGGLE ==================== */
.sidebar-toggle {
  display: none;
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1500;
  padding: 14px 28px;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 50px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  box-shadow: var(--shadow);
  transition: all var(--transition);
  gap: 8px;
  align-items: center;
}
.sidebar-toggle:hover { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
.sidebar-toggle .toggle-count { color: var(--accent); font-weight: 700; }

/* ==================== LEAFLET OVERRIDES ==================== */
.leaflet-control-zoom a,
.leaflet-bar a {
  background: var(--bg-glass) !important;
  backdrop-filter: blur(12px) !important;
  -webkit-backdrop-filter: blur(12px) !important;
  color: var(--text-primary) !important;
  border-color: var(--border) !important;
  transition: all var(--transition) !important;
}
.leaflet-control-zoom a:hover,
.leaflet-bar a:hover {
  background: var(--bg-glass-hover) !important;
  border-color: var(--border-hover) !important;
}
.leaflet-control-attribution {
  background: var(--bg-glass) !important;
  color: var(--text-muted) !important;
  font-size: 10px !important;
}
.leaflet-control-attribution a { color: var(--text-secondary) !important; }
.leaflet-control-locate .leaflet-bar-part-single { background: var(--bg-glass) !important; }
.leaflet-control-locate.active .leaflet-bar-part-single { background: var(--accent-glow) !important; border-color: var(--accent) !important; }

/* ==================== FLOATING THEME TOGGLE ==================== */
.theme-toggle {
  position: fixed;
  top: 10px;
  right: 60px;
  z-index: 1000;
  width: 34px;
  height: 34px;
  border-radius: 4px;
  background: var(--bg-glass) !important;
  backdrop-filter: blur(12px) !important;
  -webkit-backdrop-filter: blur(12px) !important;
  border: 1px solid var(--border) !important;
  color: var(--text-primary) !important;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  box-shadow: 0 1px 5px rgba(0,0,0,0.15);
  transition: all var(--transition);
  cursor: pointer;
}
.theme-toggle:hover {
  background: var(--bg-glass-hover) !important;
  border-color: var(--border-hover) !important;
  transform: scale(1.05);
}
@media (max-width: 768px) {
  .theme-toggle {
    top: auto;
    bottom: 24px;
    right: 24px;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 20px;
    box-shadow: var(--shadow);
  }
}

/* ==================== DEBUG / BIKE FINDER ==================== */
.debug-toggle-btn {
  position: fixed;
  top: 10px;
  right: 105px;
  z-index: 1000;
  height: 34px;
  padding: 0 12px;
  border-radius: 4px;
  background: var(--bg-glass) !important;
  backdrop-filter: blur(12px) !important;
  -webkit-backdrop-filter: blur(12px) !important;
  border: 1px solid var(--border) !important;
  color: var(--text-primary) !important;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 1px 5px rgba(0,0,0,0.15);
  transition: all var(--transition);
  cursor: pointer;
}
.debug-toggle-btn:hover {
  background: var(--bg-glass-hover) !important;
  border-color: var(--border-hover) !important;
  transform: scale(1.03);
}
@media (max-width: 768px) {
  .debug-toggle-btn {
    top: auto;
    bottom: 24px;
    left: 20px;
    right: auto;
    border-radius: 50px;
    height: 48px;
    padding: 0 16px;
    font-size: 13px;
    box-shadow: var(--shadow);
  }
}

.debug-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.debug-modal-overlay.open { display: flex; }
.debug-modal {
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  width: 100%;
  max-width: 860px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: fade-in 0.25s ease;
}
.debug-modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-glass);
}
.debug-modal-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.debug-modal-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  cursor: pointer;
  transition: all var(--transition);
}
.debug-modal-close:hover { background: var(--danger-bg); color: var(--danger); }
.debug-search-section {
  padding: 14px 20px;
  background: var(--bg-glass);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.debug-search-input {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  transition: all var(--transition);
}
.debug-search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
.debug-filter-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.debug-pill {
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  cursor: pointer;
  font-weight: 600;
  color: var(--text-secondary);
  transition: all var(--transition);
}
.debug-pill:hover { border-color: var(--border-hover); color: var(--text-primary); }
.debug-pill.active {
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent);
}
.debug-stats-bar {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.debug-list-container {
  flex: 1;
  overflow-y: auto;
  padding: 14px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.debug-bike-card {
  background: var(--bg-glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: all var(--transition);
}
.debug-bike-card:hover { border-color: var(--border-hover); background: var(--bg-glass-hover); }
.debug-bike-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.debug-bike-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.debug-uuid-box {
  font-family: monospace;
  font-size: 10px;
  background: var(--bg-secondary);
  padding: 3px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
  color: var(--text-muted);
  cursor: pointer;
  user-select: all;
}
.debug-uuid-box:hover { color: var(--text-primary); border-color: var(--accent); }
.debug-bike-actions { display: flex; gap: 6px; align-items: center; }
.debug-btn-action {
  font-size: 11px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 6px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all var(--transition);
}
.debug-btn-action:hover { border-color: var(--accent); color: var(--accent); }
.debug-btn-rent {
  background: var(--accent-glow);
  color: var(--accent);
  border-color: transparent;
}
.debug-btn-rent:hover {
  background: var(--accent);
  color: white;
}
.debug-code-input {
  width: 90px;
  font-size: 11px;
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-weight: 600;
  text-align: center;
}

/* ==================== POPUP ==================== */
.leaflet-popup-content-wrapper {
  background: var(--bg-glass) !important;
  backdrop-filter: blur(24px) !important;
  -webkit-backdrop-filter: blur(24px) !important;
  border: 1px solid var(--border) !important;
  border-radius: var(--radius) !important;
  color: var(--text-primary) !important;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5) !important;
  padding: 0 !important;
}
.leaflet-popup-content { margin: 0 !important; width: 280px !important; }
.leaflet-popup-tip { background: var(--bg-glass) !important; border: none !important; }
.leaflet-popup-close-button {
  color: var(--text-muted) !important;
  font-size: 22px !important;
  top: 8px !important;
  right: 12px !important;
  transition: color var(--transition) !important;
}
.leaflet-popup-close-button:hover { color: var(--text-primary) !important; }

.popup-content { padding: 20px; }
.popup-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; padding-right: 24px; }
.popup-status { font-size: 11px; color: var(--text-muted); margin-bottom: 14px; }
.popup-bar-wrapper {
  height: 6px;
  background: var(--bg-primary);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 14px;
}
.popup-bar { height: 100%; border-radius: 6px; transition: width 0.6s ease; }

<script>
// ================================================================
// CONFIG
// ================================================================
const GBFS_BASE = 'https://gbfs.omega.fifteen.eu/gbfs/2.2/marseille/en';
const ENDPOINTS = {
  info: `${GBFS_BASE}/station_information.json`,
  status: `${GBFS_BASE}/station_status.json`,
  bikes: `${GBFS_BASE}/free_bike_status.json`,
  types: `${GBFS_BASE}/vehicle_types.json`,
};
const REFRESH_MS = 60_000;
const MARSEILLE_CENTER = [43.2965, 5.3764];

const CARTO_API_KEY = 'cb1_26b6_1_4b8ca9abb34e765c27700a57';

const TILE_URLS = {
  light: `https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${CARTO_API_KEY}`,
  dark: `https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=${CARTO_API_KEY}`
};

const CORS_PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
];

// ================================================================
// STATE
// ================================================================
const state = {
  theme: 'light',           // 'light' or 'dark'
  stations: new Map(),      // station_id → merged station object
  allBikes: [],             // all current raw bikes in Marseille
  freeBikes: [],            // available free-floating bikes
  stationBikes: new Map(),  // station_id → array of docked bike objects
  vehicleTypes: new Map(),  // vehicle_type_id → type info
  userLat: null,
  userLon: null,
  searchQuery: '',
  filters: { hasBikes: false, hasDocks: false, isCharging: false },
  bikeHealth: new Map(),    // bike_id → { health_score, boomerangs_24h, trips_24h, recent_avg_speed_kmh, physical_code }
  customPhysicalCodes: new Map(), // bike_id → user-assigned physical code (persisted in localStorage)
  lastUpdated: null,
  refreshTimer: null,
  countdownTimer: null,
  countdownSec: 60,
};

// Initial theme & custom codes setup
(function initStorage() {
  const savedTheme = localStorage.getItem('bikinmars-theme');
  const preferredTheme = savedTheme || 'light';
  state.theme = preferredTheme;
  document.documentElement.setAttribute('data-theme', preferredTheme);

  try {
    const raw = localStorage.getItem('bikinmars-custom-codes');
    if (raw) {
      const parsed = JSON.parse(raw);
      Object.entries(parsed).forEach(([k, v]) => state.customPhysicalCodes.set(k, v));
    }
  } catch (e) {}
})();

// ================================================================
// DATA FETCHING
// ================================================================
let lastWorkingMethod = 0; // 0=direct, 1+=proxy index

async function fetchGBFS(url) {
  // Build ordered list: direct fetch first, then proxies
  const methods = [
    () => fetch(url, { signal: AbortSignal.timeout(8000) }),
    ...CORS_PROXIES.map(p => () => fetch(p(url), { signal: AbortSignal.timeout(12000) })),
  ];

  // Try the last working method first
  if (lastWorkingMethod > 0) {
    const pref = methods.splice(lastWorkingMethod, 1)[0];
    methods.unshift(pref);
  }

  for (let i = 0; i < methods.length; i++) {
    try {
      const res = await methods[i]();
      if (!res.ok) continue;
      const data = await res.json();
      lastWorkingMethod = i;
      return data;
    } catch (e) {
      console.warn(`Method ${i} failed for ${url}:`, e.message);
    }
  }
  throw new Error(`All methods failed for ${url}`);
}

async function loadAllData() {
  hideError();
  try {
    const [infoData, statusData, bikesData, typesData] = await Promise.all([
      fetchGBFS(ENDPOINTS.info),
      fetchGBFS(ENDPOINTS.status),
      fetchGBFS(ENDPOINTS.bikes),
      fetchGBFS(ENDPOINTS.types).catch(() => null), // non-critical
    ]);

    // Vehicle types
    state.vehicleTypes.clear();
    if (typesData?.data?.vehicle_types) {
      typesData.data.vehicle_types.forEach(vt => {
        state.vehicleTypes.set(vt.vehicle_type_id, vt);
      });
    }

    // Stations: merge info + status
    const statusMap = new Map();
    (statusData.data.stations || []).forEach(s => statusMap.set(s.station_id, s));

    state.stations.clear();
    (infoData.data.stations || []).forEach(info => {
      const sts = statusMap.get(info.station_id) || {};
      state.stations.set(info.station_id, {
        id: info.station_id,
        name: info.name,
        lat: info.lat,
        lon: info.lon,
        capacity: info.capacity || 0,
        isCharging: info.is_charging_station || false,
        isVirtual: info.is_virtual_station || false,
        rentalUris: info.rental_uris || null,
        bikes: sts.num_bikes_available || 0,
        docks: sts.num_docks_available || 0,
        isInstalled: sts.is_installed !== false,
        isRenting: sts.is_renting !== false,
        isReturning: sts.is_returning !== false,
        vehicleTypesAvailable: sts.vehicle_types_available || [],
      });
    });

    // Stationed bikes grouping
    state.stationBikes.clear();
    (bikesData.data.bikes || []).forEach(b => {
      if (!b.is_disabled && !b.is_reserved && b.station_id && b.station_id !== '') {
        if (!state.stationBikes.has(b.station_id)) {
          state.stationBikes.set(b.station_id, []);
        }
        state.stationBikes.get(b.station_id).push(b);
      }
    });

    // Free-floating bikes (available only)
    state.freeBikes = (bikesData.data.bikes || []).filter(b =>
      !b.is_disabled && !b.is_reserved && (!b.station_id || b.station_id === '')
    );

    // Tous les vélos pour l'explorateur / debug
    state.allBikes = bikesData.data.bikes || [];

    // Synchronisation de la santé des vélos (Supabase / JSON)
    await fetchBikeHealth().catch(() => {});

    state.lastUpdated = new Date();
    return true;
  } catch (err) {
    console.error('Data loading failed:', err);
    showError();
    return false;
  }
}

const SUPABASE_DEFAULT_URL = 'https://gsjfopzecerceydcrkuv.supabase.co';
const SUPABASE_DEFAULT_KEY = 'sb_publishable_EnOQfKmH5sD71lnO8QU_aw_ZQz6PG4h';

async function fetchBikeHealth() {
  try {
    const sbUrl = localStorage.getItem('bikinmars-supabase-url') || SUPABASE_DEFAULT_URL;
    const sbKey = localStorage.getItem('bikinmars-supabase-key') || SUPABASE_DEFAULT_KEY;
    if (sbUrl && sbKey) {
      const cleanUrl = sbUrl.replace(/\/$/, '');
      const res = await fetch(`${cleanUrl}/rest/v1/vw_bikes_health?select=*`, {
        headers: {
          'apikey': sbKey,
          'Authorization': `Bearer ${sbKey}`,
        },
        signal: AbortSignal.timeout(5000)
      });
      if (res.ok) {
        const data = await res.json();
        state.bikeHealth.clear();
        data.forEach(b => state.bikeHealth.set(b.bike_id, b));
        return;
      }
    }
    // Fallback fichier local statique
    const localRes = await fetch('./data/bikes_health.json', { signal: AbortSignal.timeout(3000) });
    if (localRes.ok) {
      const data = await localRes.json();
      state.bikeHealth.clear();
      (data.bikes || []).forEach(b => state.bikeHealth.set(b.bike_id, b));
    }
  } catch (e) {
    // Non-bloquant si le tracker n'a pas encore poussé de données
  }
}

// ================================================================
// MAP SETUP
// ================================================================
let map, tileLayer, stationLayer, bikeLayer;

function initMap() {
  map = L.map('map', {
    zoomControl: false,
    attributionControl: true,
  }).setView(MARSEILLE_CENTER, 13);

  const initialTileUrl = state.theme === 'dark' ? TILE_URLS.dark : TILE_URLS.light;
  tileLayer = L.tileLayer(initialTileUrl, {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a> · BikinMars',
    maxZoom: 19,
    subdomains: 'abcd',
  }).addTo(map);

  L.control.zoom({ position: 'topright' }).addTo(map);

  L.control.locate({
    position: 'topright',
    strings: { title: 'Me localiser' },
    flyTo: true,
    keepCurrentZoomLevel: true,
    onLocationFound: (e) => {
      state.userLat = e.latitude;
      state.userLon = e.longitude;
      renderStationList();
    },
  }).addTo(map);

  stationLayer = L.layerGroup().addTo(map);
  bikeLayer = L.layerGroup().addTo(map);
}

// ================================================================
// MARKERS
// ================================================================
function getStationColor(bikes, capacity, isOpen) {
  if (!isOpen) return { main: 'var(--muted)', bg: 'var(--muted-bg)' };
  if (bikes === 0) return { main: 'var(--danger)', bg: 'var(--danger-bg)' };
  const pct = capacity > 0 ? bikes / capacity : 0;
  if (pct < 0.3) return { main: 'var(--warning)', bg: 'var(--warning-bg)' };
  return { main: 'var(--success)', bg: 'var(--success-bg)' };
}

function createStationIcon(station) {
  const isOpen = station.isInstalled && station.isRenting;
  const { main, bg } = getStationColor(station.bikes, station.capacity, isOpen);
  const baseSize = 30;
  const sizeBoost = Math.min(18, Math.floor((station.capacity || 20) / 10) * 4);
  const size = baseSize + sizeBoost;
  const fontSize = size > 40 ? 14 : 12;

  const pulseClass = (station.bikes === 0 && isOpen) ? `animation: pulse-ring 2s infinite; --pulse-color: ${bg};` : '';

  return L.divIcon({
    className: '',
    html: `<div class="station-marker-wrapper" style="
      width:${size}px; height:${size}px;
      background:${bg};
      border: 2.5px solid ${main};
      color: ${main};
      font-size: ${fontSize}px;
      box-shadow: 0 0 14px ${bg}, 0 2px 8px rgba(0,0,0,0.3);
      ${pulseClass}
    ">${station.bikes}</div>`,
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
    popupAnchor: [0, -size / 2 - 4],
  });
}

function renderStations() {
  stationLayer.clearLayers();

  state.stations.forEach(station => {
    if (station.isVirtual && station.capacity === 0) return; // skip empty virtual stations

    const marker = L.marker([station.lat, station.lon], {
      icon: createStationIcon(station),
      stationId: station.id,
    });

    marker.bindPopup(() => createPopupContent(station), {
      maxWidth: 300,
      minWidth: 280,
      closeButton: true,
      className: '',
    });

    marker.on('click', () => {
      highlightStationCard(station.id);
    });

    marker.addTo(stationLayer);
  });
}

function renderFreeBikes() {
  bikeLayer.clearLayers();

  // Only show free bikes at higher zoom levels to avoid clutter
  if (map.getZoom() < 15) return;

  // 1. Draw Free-floating bikes (available only)
  state.freeBikes.forEach(bike => {
    if (!bike.lat || !bike.lon) return;

    const vtInfo = getVehicleTypeInfo(bike.vehicle_type_id);
    const maxRange = vtInfo.maxRange || 40000;
    const rangePct = Math.round((bike.current_range_meters / maxRange) * 100);

    const circle = L.circleMarker([bike.lat, bike.lon], {
      radius: 5,
      color: vtInfo.isElectric ? 'var(--warning)' : 'var(--success)',
      fillColor: vtInfo.isElectric ? 'var(--warning)' : 'var(--success)',
      fillOpacity: 0.7,
      weight: 1.5,
    });

    let tip = vtInfo.isElectric ? `⚡ Vélo électrique (Free-floating)` : `🚲 Vélo mécanique (Free-floating)`;
    if (vtInfo.isElectric) tip += ` · 🔋 ${rangePct}% (${Math.round(bike.current_range_meters / 1000)} km)`;
    
    const bikeUri = getRentalUri(bike.rental_uris, bike);
    if (bikeUri) {
      circle.on('click', () => {
        window.open(bikeUri, '_blank', 'noopener');
      });
      tip += `<br/><span style="font-size:10px;color:var(--accent);font-weight:bold;">👉 Clic pour louer ce vélo</span>`;
    }
    
    circle.bindTooltip(tip, { direction: 'top', className: '' });
    circle.addTo(bikeLayer);
  });

  // 2. Draw Docked bikes at their high-precision GPS coordinates when zoomed in very close (zoom >= 17)
  if (map.getZoom() >= 17) {
    state.stationBikes.forEach((bikesList, stationId) => {
      // Sort docked bikes at this station by range to give consistent index labelling
      const sortedBikes = [...bikesList].sort((a, b) => {
        const aRange = a.current_range_meters || 0;
        const bRange = b.current_range_meters || 0;
        return bRange - aRange;
      });

      sortedBikes.forEach((bike, index) => {
        if (!bike.lat || !bike.lon) return;

        const vtInfo = getVehicleTypeInfo(bike.vehicle_type_id);
        const rangeKm = Math.round((bike.current_range_meters || 0) / 1000);
        const maxRange = vtInfo.maxRange || 40000;
        const rangePct = Math.round(((bike.current_range_meters || 0) / maxRange) * 100);

        // Color-code based on battery charge level
        let color = 'var(--success)';
        if (!vtInfo.isElectric) color = 'var(--success)'; // Green for mechanics
        else if (rangePct === 0) color = 'var(--danger)'; // Red for empty
        else if (rangePct < 35) color = 'var(--warning)'; // Orange for low

        // White border to denote "docked in a station dock"
        const circle = L.circleMarker([bike.lat, bike.lon], {
          radius: 6,
          color: '#FFFFFF', 
          fillColor: color,
          fillOpacity: 0.95,
          weight: 2,
          boxShadow: '0 2px 5px rgba(0,0,0,0.3)',
        });

        const health = state.bikeHealth.get(bike.bike_id) || {};
        const physicalCode = health.physical_code || bike.physical_code;
        const baseLabel = vtInfo.isElectric ? `Élec #${index + 1}` : `Méca #${index + 1}`;
        const bikeLabel = physicalCode ? `${baseLabel} (N°${physicalCode})` : baseLabel;
        let tip = `<b>${bikeLabel} (En station)</b><br/>`;
        if (vtInfo.isElectric) {
          tip += `⚡ Électrique · 🔋 ${rangePct}% (${rangeKm} km)`;
        } else {
          tip += `🚲 Mécanique`;
        }

        const bikeUri = getRentalUri(bike.rental_uris, bike);
        if (bikeUri) {
          circle.on('click', () => {
            window.open(bikeUri, '_blank', 'noopener');
          });
          tip += `<br/><span style="font-size:10px;color:var(--accent);font-weight:bold;">👉 Clic pour louer ce vélo</span>`;
        }

        circle.bindTooltip(tip, { direction: 'top', className: '' });
        circle.addTo(bikeLayer);
      });
    });
  }
}

function getVehicleTypeInfo(vtId) {
  const vt = state.vehicleTypes.get(vtId);
  if (!vt) return { name: 'Vélo', icon: '🚲', isElectric: false, maxRange: 0 };
  const isElectric = vt.propulsion_type === 'electric_assist' || vt.propulsion_type === 'electric';
  return {
    name: vt.name?.replace(/_/g, ' ') || (isElectric ? 'Électrique' : 'Mécanique'),
    icon: isElectric ? '⚡' : '🚲',
    isElectric,
    maxRange: vt.max_range_meters || 0,
  };
}

function createPopupContent(station) {
  const isOpen = station.isInstalled && station.isRenting;
  const { main } = getStationColor(station.bikes, station.capacity, isOpen);
  const effectiveCap = Math.max(station.capacity, station.bikes + station.docks) || 1;
  const pct = Math.round((station.bikes / effectiveCap) * 100);

  const statusText = !station.isInstalled ? '🔧 Hors service'
    : !station.isRenting ? '⏸️ Location suspendue'
    : station.isCharging ? '⚡ Station de recharge' : '✅ Opérationnelle';

  // Vehicle type breakdown
  let typesHtml = '';
  const vtAvail = station.vehicleTypesAvailable.filter(v => v.count > 0);
  if (vtAvail.length > 0) {
    typesHtml = '<div class="popup-types">' + vtAvail.map(v => {
      const info = getVehicleTypeInfo(v.vehicle_type_id);
      const bgColor = info.isElectric ? 'var(--warning-bg)' : 'var(--success-bg)';
      const color = info.isElectric ? 'var(--warning)' : 'var(--success)';
      return `<span class="popup-type-badge" style="background:${bgColor};color:${color}">${info.icon} ${v.count}</span>`;
    }).join('') + '</div>';
  }

  // Action buttons
  const rentalUri = getRentalUri(station.rentalUris);
  const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${station.lat},${station.lon}&travelmode=walking`;

  // Get and sort individual bikes at this station by health and battery range
  let bikesListHtml = '';
  const stationBikesList = state.stationBikes.get(station.id) || [];
  if (stationBikesList.length > 0) {
    // Enrich with health data
    stationBikesList.forEach(b => {
      b._health = state.bikeHealth.get(b.bike_id) || { health_score: 100, boomerangs_24h: 0 };
    });

    // Sort: healthy first (0 boomerang), then highest battery
    stationBikesList.sort((a, b) => {
      const aBoomerangs = a._health.boomerangs_24h || 0;
      const bBoomerangs = b._health.boomerangs_24h || 0;
      if (aBoomerangs !== bBoomerangs) {
        return aBoomerangs - bBoomerangs; // Vélos sans boomerang en premier
      }
      const aScore = a._health.health_score ?? 100;
      const bScore = b._health.health_score ?? 100;
      if (Math.abs(aScore - bScore) > 20) {
        return bScore - aScore;
      }
      const aRange = a.current_range_meters || 0;
      const bRange = b.current_range_meters || 0;
      return bRange - aRange;
    });

    bikesListHtml += '<div class="popup-bikes-list-title">⚡ Vélos en station (Classés par fiabilité) :</div>';
    bikesListHtml += '<div class="popup-bikes-scroll-container">';
    
    let hasRecommended = false;
    stationBikesList.forEach((bike, index) => {
      const vtInfo = getVehicleTypeInfo(bike.vehicle_type_id);
      const rangeKm = Math.round((bike.current_range_meters || 0) / 1000);
      const maxRange = vtInfo.maxRange || 40000;
      const rangePct = Math.round(((bike.current_range_meters || 0) / maxRange) * 100);
      const health = bike._health || {};
      const physicalCode = health.physical_code || bike.physical_code;
      const boomerangs = health.boomerangs_24h || 0;

      const isWarning = boomerangs > 0 || (health.health_score != null && health.health_score < 40);
      const isTop = !hasRecommended && vtInfo.isElectric && !isWarning && rangePct > 35;
      if (isTop) hasRecommended = true;

      const batIcon = rangePct > 80 ? '🔋' : rangePct > 35 ? '🪫' : '⚠️';
      const baseLabel = vtInfo.isElectric ? `Élec #${index + 1}` : `Méca #${index + 1}`;
      const bikeLabel = physicalCode ? `${baseLabel} <small style="opacity:0.8;font-weight:600;">(N°${physicalCode})</small>` : baseLabel;
      
      let badgeHtml = '';
      if (isTop) {
        badgeHtml = '<span class="popup-health-tag tag-recommended">🏆 Top</span>';
      } else if (isWarning) {
        badgeHtml = `<span class="popup-health-tag tag-warning" title="${boomerangs} retour(s) immédiat(s)">⚠️ Suspect</span>`;
      }

      const batteryText = vtInfo.isElectric ? `${batIcon} ${rangePct}% (${rangeKm} km)` : '🚲 Mécanique';
      const bikeUri = getRentalUri(bike.rental_uris, bike);
      const itemClass = isTop ? 'popup-bike-item recommended' : (isWarning ? 'popup-bike-item warning-bike' : 'popup-bike-item');

      bikesListHtml += `
        <div class="${itemClass}">
          <span class="popup-bike-name">${bikeLabel} ${badgeHtml}</span>
          <span class="popup-bike-battery">${batteryText}</span>
          ${bikeUri ? `<a href="${bikeUri}" class="popup-bike-btn" target="_blank" rel="noopener">Louer</a>` : ''}
        </div>
      `;
    });
    bikesListHtml += '</div>';
    bikesListHtml += '<div class="popup-bikes-hint">💡 Identifiez le vélo sur la borne grâce à sa jauge de batterie.</div>';
  }

  return `
    <div class="popup-content">
      <h3 class="popup-title">${station.name}</h3>
      <div class="popup-status">${statusText}</div>
      <div class="popup-bar-wrapper">
        <div class="popup-bar" style="width:${pct}%; background:${main}"></div>
      </div>
      <div class="popup-stats">
        <div class="popup-stat">
          <span class="popup-stat-value" style="color:${main}">${station.bikes}</span>
          <span class="popup-stat-label">vélos</span>
        </div>
        <div class="popup-stat">
          <span class="popup-stat-value">${station.docks}</span>
          <span class="popup-stat-label">places</span>
        </div>
        <div class="popup-stat">
          <span class="popup-stat-value" style="font-size:16px">${station.capacity}</span>
          <span class="popup-stat-label">capacité</span>
        </div>
      </div>
      ${typesHtml}
      ${bikesListHtml}
      <div class="popup-actions">
        ${rentalUri ? `<a href="${rentalUri}" class="popup-btn popup-btn-primary" target="_blank" rel="noopener">📱 Levélo</a>` : ''}
        <a href="${directionsUrl}" class="popup-btn popup-btn-secondary" target="_blank" rel="noopener">🧭 Y aller</a>
      </div>
    </div>
  `;
}

function getRentalUri(uris, bike) {
  // 1. Si le vélo a un code physique appairé (QR code à 6 chiffres, ex: 124692)
  const physicalCode = bike?.physical_code || (bike?.bike_id ? state.bikeHealth.get(bike.bike_id)?.physical_code : null);
  if (physicalCode && /^\d+$/.test(String(physicalCode).trim())) {
    return `https://www.thisebike.com/?bike_id=${String(physicalCode).trim()}`;
  }

  // 2. Si on a des URIs de l'application Levélo (vid=UUID)
  if (uris) {
    const ua = navigator.userAgent;
    if (/iPhone|iPad|iPod/i.test(ua)) return uris.ios || uris.android || null;
    if (/Android/i.test(ua)) return uris.android || uris.ios || null;
    return uris.ios || uris.android || uris.web || null;
  }

  // 3. Fallback direct vers l'application Levélo
  const bikeId = bike?.bike_id || (typeof bike === 'string' ? bike : null);
  if (bikeId) {
    return `levelo://app?vid=${bikeId}`;
  }

  return 'https://levelo.ampmetropole.fr/fr/sharing?app=1';
}

function updateStats() {
  let totalBikes = 0, totalDocks = 0, activeStations = 0;
  state.stations.forEach(s => {
    if (s.isInstalled) {
      totalBikes += s.bikes;
      totalDocks += s.docks;
      activeStations++;
    }
  });

  document.getElementById('stat-bikes').textContent = totalBikes;
  document.getElementById('stat-docks').textContent = totalDocks;
  document.getElementById('stat-stations').textContent = activeStations;
  document.getElementById('toggle-count').textContent = totalBikes;
}

function getFilteredStations() {
  let list = Array.from(state.stations.values());

  // Search
  if (state.searchQuery) {
    const q = normalizeText(state.searchQuery);
    list = list.filter(s => normalizeText(s.name).includes(q));
  }

  // Filters
  if (state.filters.hasBikes) list = list.filter(s => s.bikes > 0);
  if (state.filters.hasDocks) list = list.filter(s => s.docks > 0);
  if (state.filters.isCharging) list = list.filter(s => s.isCharging);

  // Sort: by distance if geoloc, else alphabetically
  if (state.userLat !== null) {
    list.forEach(s => {
      s._dist = haversine(state.userLat, state.userLon, s.lat, s.lon);
    });
    list.sort((a, b) => a._dist - b._dist);
  } else {
    list.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  }

  return list;
}

function renderStationList() {
  const container = document.getElementById('station-list');
  const filtered = getFilteredStations();

  if (filtered.length === 0) {
    container.innerHTML = '<div class="station-list-empty">Aucune station trouvée</div>';
    return;
  }

  container.innerHTML = filtered.map(s => {
    const isOpen = s.isInstalled && s.isRenting;
    const { main } = getStationColor(s.bikes, s.capacity, isOpen);
    const effectiveCap = Math.max(s.capacity, s.bikes + s.docks) || 1;
    const pct = Math.round((s.bikes / effectiveCap) * 100);
    const distText = s._dist != null ? formatDistance(s._dist) : '';

    let badges = '';
    const vtAvail = s.vehicleTypesAvailable.filter(v => v.count > 0);
    vtAvail.forEach(v => {
      const info = getVehicleTypeInfo(v.vehicle_type_id);
      if (info.isElectric) {
        badges += `<span class="badge badge-electric">⚡ ${v.count}</span>`;
      }
    });
    if (s.isCharging) badges += `<span class="badge badge-charging">🔌</span>`;

    return `
      <div class="station-card" data-station-id="${s.id}" onclick="flyToStation('${s.id}')"
           style="animation: fade-in 0.3s ease both; animation-delay: 0ms;">
        <div class="station-card-header">
          <span class="station-card-name">${s.name}</span>
          ${distText ? `<span class="station-card-distance">${distText}</span>` : ''}
        </div>
        <div class="station-card-bar">
          <div class="station-card-bar-fill" style="width:${pct}%; background:${main}"></div>
        </div>
        <div class="station-card-meta">
          <span>🚲 ${s.bikes}</span>
          <span>🅿️ ${s.docks}</span>
        </div>
        ${badges ? `<div class="station-card-badges">${badges}</div>` : ''}
      </div>
    `;
  }).join('');
}

function flyToStation(stationId) {
  const station = state.stations.get(stationId);
  if (!station) return;

  map.flyTo([station.lat, station.lon], 17, { duration: 0.8 });

  // Open popup
  stationLayer.eachLayer(layer => {
    if (layer.options.stationId === stationId) {
      setTimeout(() => layer.openPopup(), 400);
    }
  });

  // Close sidebar on mobile
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
  }

  highlightStationCard(stationId);
}

function highlightStationCard(stationId) {
  document.querySelectorAll('.station-card').forEach(card => {
    card.classList.toggle('highlighted', card.dataset.stationId === stationId);
  });

  // Scroll card into view
  const card = document.querySelector(`.station-card[data-station-id="${stationId}"]`);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ================================================================
// UTILS
// ================================================================
function normalizeText(str) {
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDistance(meters) {
  if (meters < 1000) return `${Math.round(meters)} m`;
  return `${(meters / 1000).toFixed(1)} km`;
}

let debugActiveFilter = 'all';

function getBikePhysicalCode(bikeId) {
  if (!bikeId) return null;
  const custom = state.customPhysicalCodes.get(bikeId);
  if (custom) return custom;
  const health = state.bikeHealth.get(bikeId);
  if (health?.physical_code) return health.physical_code;
  return null;
}

function saveBikePhysicalCode(bikeId, code) {
  if (!bikeId) return;
  const cleanCode = code ? String(code).trim() : '';
  if (cleanCode && /^\d+$/.test(cleanCode)) {
    state.customPhysicalCodes.set(bikeId, cleanCode);
    showToast(`✅ Vélo appairé avec le N° ${cleanCode}`);
  } else {
    state.customPhysicalCodes.delete(bikeId);
    showToast(`🗑️ Code physique supprimé`);
  }
  const obj = Object.fromEntries(state.customPhysicalCodes);
  localStorage.setItem('bikinmars-custom-codes', JSON.stringify(obj));
  
  renderStations();
  renderFreeBikes();
  renderStationList();
  renderDebugBikesList();
}

function setupDebugModal() {
  const btn = document.getElementById('debug-toggle-btn');
  const overlay = document.getElementById('debug-modal-overlay');
  const closeBtn = document.getElementById('debug-modal-close');
  const searchInput = document.getElementById('debug-search-input');

  if (!btn || !overlay) return;

  btn.addEventListener('click', () => {

  });

  if (closeBtn) {

      overlay.classList.remove('open');

  document.querySelectorAll('.debug-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('.debug-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      debugActiveFilter = pill.dataset.debugFilter;
      renderDebugBikesList();
    });

}

function renderDebugBikesList() {
  const container = document.getElementById('debug-list-container');
  if (!container) return;

  const searchVal = normalizeText(document.getElementById('debug-search-input')?.value || '');
  const allBikes = state.allBikes || [];

  const countAllElem = document.getElementById('debug-count-all');
  if (countAllElem) countAllElem.textContent = allBikes.length;

  let filtered = allBikes.filter(bike => {
    const vtInfo = getVehicleTypeInfo(bike.vehicle_type_id);
    const physicalCode = getBikePhysicalCode(bike.bike_id) || '';
    const station = bike.station_id ? state.stations.get(bike.station_id) : null;
    const stationName = station ? station.name : 'Free-floating';
    const rangeKm = Math.round((bike.current_range_meters || 0) / 1000);

    // Filters
    if (debugActiveFilter === 'electric' && !vtInfo.isElectric) return false;
    if (debugActiveFilter === 'station' && (!bike.station_id || bike.station_id === '')) return false;
    if (debugActiveFilter === 'free' && bike.station_id && bike.station_id !== '') return false;
    if (debugActiveFilter === 'matched' && !physicalCode) return false;
    if (debugActiveFilter === 'disabled' && !bike.is_disabled && rangeKm > 0) return false;

    // Search
    if (searchVal) {
      const matchCode = physicalCode.toLowerCase().includes(searchVal);
      const matchUuid = bike.bike_id.toLowerCase().includes(searchVal);
      const matchStation = normalizeText(stationName).includes(searchVal);
      const matchRange = `${rangeKm}km`.includes(searchVal) || `${rangeKm}` === searchVal;
      return matchCode || matchUuid || matchStation || matchRange;
    }

    return true;
  });

  // Sort: matched first, then highest range
  filtered.sort((a, b) => {
    const aCode = getBikePhysicalCode(a.bike_id);
    const bCode = getBikePhysicalCode(b.bike_id);
    if (aCode && !bCode) return -1;
    if (!aCode && bCode) return 1;
    return (b.current_range_meters || 0) - (a.current_range_meters || 0);
  });

  const totalFiltered = filtered.length;
  const displayLimit = 120;
  const displayed = filtered.slice(0, displayLimit);

  const matchedCount = allBikes.filter(b => getBikePhysicalCode(b.bike_id)).length;
  const stationCount = allBikes.filter(b => b.station_id && b.station_id !== '').length;
  const freeCount = allBikes.length - stationCount;

  const statsTextElem = document.getElementById('debug-stats-text');
  if (statsTextElem) {
    statsTextElem.textContent = 
      `${allBikes.length} vélos connectés (${stationCount} en station, ${freeCount} en rue, ${matchedCount} appairés) · Affichage : ${displayed.length}/${totalFiltered}`;
  }

  if (displayed.length === 0) {
    container.innerHTML = `<div class="station-list-empty">Aucun vélo trouvé pour cette recherche</div>`;
    return;
  }

  container.innerHTML = displayed.map(b => {
    const vtInfo = getVehicleTypeInfo(b.vehicle_type_id);
    const physicalCode = getBikePhysicalCode(b.bike_id) || '';
    const station = b.station_id ? state.stations.get(b.station_id) : null;
    const stationName = station ? `🅿️ Station <strong>${station.name}</strong>` : '📍 Free-floating (dans la rue)';
    const maxRange = vtInfo.maxRange || 40000;
    const rangeKm = Math.round((b.current_range_meters || 0) / 1000);
    const rangePct = Math.round(((b.current_range_meters || 0) / maxRange) * 100);

    const rentUrl = getRentalUri(b.rental_uris, b);
    const batIcon = rangePct > 80 ? '🔋' : rangePct > 35 ? '🪫' : '⚠️';
    const statusBadge = b.is_disabled ? '<span class="badge" style="background:var(--danger-bg);color:var(--danger);">Hors service</span>' 
      : (b.is_reserved ? '<span class="badge" style="background:var(--warning-bg);color:var(--warning);">Réservé</span>' : '<span class="badge" style="background:var(--success-bg);color:var(--success);">Disponible</span>');

    return `
      <div class="debug-bike-card">
        <div class="debug-bike-row">
          <div class="debug-bike-title">
            <span>${vtInfo.icon}</span>
            <span>${physicalCode ? `Vélo N°<strong>${physicalCode}</strong>` : 'Vélo (UUID)'}</span>
            ${statusBadge}
          </div>
          <div style="font-size:12px; font-weight:700; color:${rangePct > 35 ? 'var(--success)' : 'var(--danger)'}">
            ${batIcon} ${rangePct}% (${rangeKm} km)
          </div>
        </div>

        <div class="debug-bike-row" style="font-size:11px; color:var(--text-secondary);">
          <div>${stationName}</div>
          <div class="debug-uuid-box" title="Cliquer pour copier l'UUID complet" onclick="copyToClipboard('${b.bike_id}')">
            🆔 ${b.bike_id.slice(0, 13)}... 📋
          </div>
        </div>

        <div class="debug-bike-row" style="border-top:1px dashed var(--border); padding-top:6px; margin-top:2px;">
          <div style="display:flex; align-items:center; gap:6px; font-size:11px;">
            <label style="color:var(--text-muted);">N° QR :</label>
            <input type="text" class="debug-code-input" placeholder="Ex: 124692" value="${physicalCode}" 
                   onchange="saveBikePhysicalCode('${b.bike_id}', this.value)" />
          </div>

          <div class="debug-bike-actions">
            ${b.lat && b.lon ? `<button class="debug-btn-action" onclick="flyToBike('${b.bike_id}', ${b.lat}, ${b.lon}, '${b.station_id || ''}')">🧭 Localiser</button>` : ''}
            ${rentUrl ? `<a href="${rentUrl}" class="debug-btn-action debug-btn-rent" target="_blank" rel="noopener">🔓 Louer</a>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function flyToBike(bikeId, lat, lon, stationId) {
  document.getElementById('debug-modal-overlay')?.classList.remove('open');

  if (stationId) {
    flyToStation(stationId);
  } else {
    map.flyTo([lat, lon], 18, { duration: 0.8 });
    showToast(`📍 Vélo localisé en direct [${lat.toFixed(4)}, ${lon.toFixed(4)}]`);
  }
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showToast(`📋 UUID copié !`);
    }).catch(() => {
      prompt('UUID du vélo :', text);
    });
  } else {
    prompt('UUID du vélo :', text);
  }
}

// ================================================================
// INIT
// ================================================================
async function init() {
  initMap();
  setupSearch();
  setupFilters();
  setupSidebarToggle();
  setupZoomHandler();
  setupThemeToggle();
  setupDebugModal();

  const ok = await loadAllData();

  document.getElementById('loading-overlay').classList.add('hidden');

  if (ok) {
    renderStations();
    renderFreeBikes();
    updateStats();
    renderStationList();
    renderDebugBikesList();
    updateLastUpdated();
    startAutoRefresh();
    showToast('🚲 BikinMars est prêt !');
  }
}

init();
</script>
</body>
</html>
