name: Levélo Live Trip Tracker & Supabase Sync

on:
  schedule:
    # Exécution automatique toutes les 5 minutes 24h/24
    - cron: '*/5 * * * *'
  workflow_dispatch: # Déclenchement manuel possible depuis l'onglet Actions

jobs:
  track-bikes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Supabase Levélo Tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python tracker/tracker_supabase.py
